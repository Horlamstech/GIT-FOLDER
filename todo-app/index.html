<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>To-Do App</title>
<style>
body{
  font-family:sans-serif;
  background:#020617;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  background:#0f172a;
  padding:20px;
  border-radius:10px;
  width:300px;
}

input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
}

button{
  width:100%;
  padding:10px;
  background:#38bdf8;
  border:none;
  cursor:pointer;
}

li{
  li{
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#020617;
  padding:8px;
  border-radius:5px;
}

li button{
  width:auto;
  padding:5px 10px;
  background:#ef4444;
  color:white;
  border:none;
  border-radius:4px;
  cursor:pointer;
}
}
</style>
</head>

<body>

<div class="container">
  <h2>To-Do App </h2>

  <input id="task" placeholder="Enter task">
  <button onclick="addTask()">Add</button>

  <ul id="list"></ul>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

// Load tasks on page load
window.onload = function(){
  tasks.forEach(task => createTaskElement(task));
};

function addTask(){
  let taskInput = document.getElementById("task");
  let task = taskInput.value;

  if(task === "") return;

  tasks.push(task);
  localStorage.setItem("tasks", JSON.stringify(tasks));

  createTaskElement(task);
  taskInput.value = "";
}

function createTaskElement(task){
  let li = document.createElement("li");

  let span = document.createElement("span");
  span.textContent = task;

  let btn = document.createElement("button");
  btn.textContent = "X";

  btn.onclick = function(){
    li.remove(); // remove from UI

    tasks = tasks.filter(t => t !== task); // remove from array
    localStorage.setItem("tasks", JSON.stringify(tasks)); // update storage
  };

  li.appendChild(span);
  li.appendChild(btn);

  document.getElementById("list").appendChild(li);
}
</script>

</body>
</html>
